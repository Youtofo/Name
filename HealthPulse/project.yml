name: HealthPulse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  HealthPulse:
    type: application
    platform: iOS
    sources: [HealthPulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthpulse
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "HealthPulse reads your health data to show your trends."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: HealthPulse/HealthPulse.entitlements
